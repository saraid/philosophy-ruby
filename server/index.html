<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@ruby/4.0-wasm-wasi@2.8.1/dist/browser.script.iife.js"></script>
    <script type="text/ruby" data-eval="async">
      puts RUBY_VERSION # (Printed to the Web browser console)

      # Patch require_relative to load from remote
      require 'js/require_remote'

      module Kernel
        alias original_require_relative require_relative

        # The require_relative may be used in the embedded Gem.
        # First try to load from the built-in filesystem, and if that fails,
        # load from the URL.
        def require_relative(path)
          caller_path = caller_locations(1, 1).first.absolute_path || ''
          dir = File.dirname(caller_path)
          file = File.absolute_path(path, dir)

          original_require_relative(file)
        rescue LoadError
          JS::RequireRemote.instance.load(path)
        end
      end

      # The above patch should not break the original require_relative
      require 'uri'
      URI.parse('http://example.com')

      # Load the main script
      require_relative '../lib/philosophy'
      require_relative '../lib/philosophy/shims/svg'

      game = Philosophy::Game.new
      game << 'In+:indigo'
      game << 'Te+:teal'
      game << 'In:C4PuNo'
      #game << 'Te:C7PuNo'
      #game << 'Te:C1PuSo'
      game << 'Te:C2ReSw[Ea]'

      def render_game(game)
        JS.global[:document].querySelector('#pgn')[:innerHTML] = game.to_pgn
        game.board.each do
          JS.global[:document].querySelector("#space-#{_1.name}")[:innerHTML] = _1.name.to_s
        end

        game.board.each.select(&:occupied?).each do
          JS.global[:document].querySelector("#space-#{_1.name}")[:innerHTML] = _1.tile.notation
        end

        puts game.last_board_operations.map(&:to_tuple).inspect
        game.last_board_operations.each do |operation|
          case operation
          #in [:place, _, _, location, _]
          when Philosophy::ActivationContext::Operation::Place
            location = operation.location.name
            current_html = JS.global[:document].querySelector("#space-#{location}")[:innerHTML]
            JS.global[:document].querySelector("#space-#{location}")[:innerHTML] = "#{current_html}<br/>#{operation.to_svg}"
          when Philosophy::ActivationContext::Operation::Rotate
            location = operation.target_location.name
            current_html = JS.global[:document].querySelector("#space-#{location}")[:innerHTML]
            JS.global[:document].querySelector("#space-#{location}")[:innerHTML] = "#{current_html}<br/>#{operation.to_svg}"
          when Philosophy::ActivationContext::Operation::Move
            grid_position =
              case operation.impact_direction.value
              when :north
                { "grid-column-start": "#{operation.from_location.coordinate.col+1};",
                  "grid-column-end": "#{operation.from_location.coordinate.col+1};",
                  "grid-row-start": "#{operation.from_location.coordinate.row};",
                  "grid-row-end": "span #{operation.from_location.coordinate.row+1};",
                }
              when :south
                { "grid-column-start": "#{operation.from_location.coordinate.col+1};",
                  "grid-column-end": "#{operation.from_location.coordinate.col+1};",
                  "grid-row-start": "#{operation.from_location.coordinate.row+1};",
                  "grid-row-end": "span #{operation.from_location.coordinate.row+2};",
                }
              end.map { "#{_1}:#{_2}" }.join
            puts grid_position

            div = JS.global[:document].createElement("div")
            div[:class] = "operation-move"
            div[:style] = [
            grid_position,
              "z-index:2;"
            ].join
            div[:innerHTML] = operation.to_svg
            JS.global[:document].querySelector("#overlay").appendChild(div)
          else
          end
        end
      end

      input = JS.global[:document].querySelector('#input input')
      button = JS.global[:document].querySelector('#input button')
      button.addEventListener("click") do |event|
        game << input[:value].to_s
        render_game(game)
      end

      render_game(game)
    </script>
    <link rel="stylesheet" href="./board.css">
    <style type="text/css">
      main {
        display: flex;
      }
    </style>
  </head>

          <div id="space-c5" class="space playable">C5</div>
          <div id="space-c6" class="space playable">C6</div>
          <div id="space-c7" class="space playable">C7</div>
          <div id="space-c8" class="space playable">C8</div>
          <div id="space-c9" class="space playable">C9</div>

          <div id="space-n1" class="space">N1</div>
          <div id="space-n2" class="space">N2</div>
          <div id="space-n3" class="space">N3</div>
          <div id="space-n4" class="space">N4</div>
          <div id="space-n5" class="space">N5</div>
          <div id="space-n6" class="space">N6</div>

          <div id="space-ne" class="space">NE</div>

          <div id="space-e1" class="space">E1</div>
          <div id="space-e2" class="space">E2</div>
          <div id="space-e3" class="space">E3</div>
          <div id="space-e4" class="space">E4</div>
          <div id="space-e5" class="space">E5</div>
          <div id="space-e6" class="space">E6</div>

          <div id="space-se" class="space">SE</div>

          <div id="space-s1" class="space">S1</div>
          <div id="space-s2" class="space">S2</div>
          <div id="space-s3" class="space">S3</div>
          <div id="space-s4" class="space">S4</div>
          <div id="space-s5" class="space">S5</div>
          <div id="space-s6" class="space">S6</div>

          <div id="space-sw" class="space">SW</div>

          <div id="space-w1" class="space">W1</div>
          <div id="space-w2" class="space">W2</div>
          <div id="space-w3" class="space">W3</div>
          <div id="space-w4" class="space">W4</div>
          <div id="space-w5" class="space">W5</div>
          <div id="space-w6" class="space">W6</div>

          <div id="space-nw" class="space">NW</div>
        </div>
        <div id="overlay"></div>
      </div>
      <pre id="pgn">
      </pre>

        <button>Submit</button>

</html>
