<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@ruby/4.0-wasm-wasi@2.8.1/dist/browser.script.iife.js"></script>
    <script type="text/ruby" data-eval="async" src="./main.rb"></script>
    <link rel="stylesheet" href="./board.css">
    <link rel="stylesheet" href="./main.css">
    <style type="text/css">
      main {
        display: flex;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="board">
        <div id="spaces">
          <div id="space-c1" class="space playable">C1</div>
          <div id="space-c2" class="space playable">C2</div>
          <div id="space-c3" class="space playable">C3</div>
          <div id="space-c4" class="space playable">C4</div>
          <div id="space-c5" class="space playable">C5</div>
          <div id="space-c6" class="space playable">C6</div>
          <div id="space-c7" class="space playable">C7</div>
          <div id="space-c8" class="space playable">C8</div>
          <div id="space-c9" class="space playable">C9</div>

          <div id="space-n1" class="space">N1</div>
          <div id="space-n2" class="space">N2</div>
          <div id="space-n3" class="space">N3</div>
          <div id="space-n4" class="space">N4</div>
          <div id="space-n5" class="space">N5</div>
          <div id="space-n6" class="space">N6</div>

          <div id="space-ne" class="space">NE</div>

          <div id="space-e1" class="space">E1</div>
          <div id="space-e2" class="space">E2</div>
          <div id="space-e3" class="space">E3</div>
          <div id="space-e4" class="space">E4</div>
          <div id="space-e5" class="space">E5</div>
          <div id="space-e6" class="space">E6</div>

          <div id="space-se" class="space">SE</div>

          <div id="space-s1" class="space">S1</div>
          <div id="space-s2" class="space">S2</div>
          <div id="space-s3" class="space">S3</div>
          <div id="space-s4" class="space">S4</div>
          <div id="space-s5" class="space">S5</div>
          <div id="space-s6" class="space">S6</div>

          <div id="space-sw" class="space">SW</div>

          <div id="space-w1" class="space">W1</div>
          <div id="space-w2" class="space">W2</div>
          <div id="space-w3" class="space">W3</div>
          <div id="space-w4" class="space">W4</div>
          <div id="space-w5" class="space">W5</div>
          <div id="space-w6" class="space">W6</div>

          <div id="space-nw" class="space">NW</div>
        </div>
        <div id="operations"></div>
      </div>
      <div id="meh">
        <div id="tests"></div>
        <div id="input">
          <input type="text" />
          <button>Submit</button>
          <div id="error"></div>
        </div>
        <pre id="pgn">
        </pre>
      </div>
    </main>
  </body>
</html>
